<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .grid { display: flex; gap: 30px; align-items: center; }
  .box { background: #1e293b; padding: 20px; border-radius: 16px; text-align: center; border: 1px solid #334155; }
  svg { width: 120px; height: 120px; }
</style>
</head>
<body>
  <h2>Knight SVG Design Preview</h2>
  <div class="grid">
    <div class="box">
      <h3>White Knight</h3>
      <svg viewBox="0 0 45 45">
        <g>
          <!-- Ground shadow -->
          <ellipse cx="22.5" cy="38.5" rx="10.5" ry="3" fill="rgba(0,0,0,0.15)" />
          <!-- Main Body -->
          <path d="M32 36.5 C32 38, 13 38, 13 36.5 C13 32, 17 26, 17 24 C16 23.5 13.5 24.5 11.5 22.5 C9.8 20.8 10 18.5 12 16.8 L17 12.2 L16.2 6.8 C16 5.8 17.5 5.5 18.8 6.8 L21.2 10.2 C24.5 8.5 32 9.5 32 14.5 Z" fill="#e6f0fa" stroke="#a0b6cc" stroke-width="2.2" stroke-linejoin="round"/>
          <!-- Muzzle/Face Shading Overlay -->
          <path d="M17 12.2 L12 16.8 C10 18.5 9.8 20.8 11.5 22.5 C13.5 24.5 16 23.5 17 24 C17 26, 13 32, 13 36.5 C13 36.5 19 37 21.5 32 L20 20 Z" fill="#70889f" opacity="0.35" />
          <!-- Eye -->
          <ellipse cx="23.5" cy="16.5" rx="1.3" ry="2.2" fill="#a0b6cc" />
          <!-- Smile / Cheek Crease -->
          <path d="M22.5 23.5 Q26 26.5 30 22.5" fill="none" stroke="#a0b6cc" stroke-width="2.5" stroke-linecap="round" />
        </g>
      </svg>
    </div>
    <div class="box">
      <h3>Black Knight</h3>
      <svg viewBox="0 0 45 45">
        <g>
          <!-- Ground shadow -->
          <ellipse cx="22.5" cy="38.5" rx="10.5" ry="3" fill="rgba(0,0,0,0.3)" />
          <!-- Main Body -->
          <path d="M32 36.5 C32 38, 13 38, 13 36.5 C13 32, 17 26, 17 24 C16 23.5 13.5 24.5 11.5 22.5 C9.8 20.8 10 18.5 12 16.8 L17 12.2 L16.2 6.8 C16 5.8 17.5 5.5 18.8 6.8 L21.2 10.2 C24.5 8.5 32 9.5 32 14.5 Z" fill="#52585e" stroke="#373c41" stroke-width="2.2" stroke-linejoin="round"/>
          <!-- Muzzle/Face Shading Overlay -->
          <path d="M17 12.2 L12 16.8 C10 18.5 9.8 20.8 11.5 22.5 C13.5 24.5 16 23.5 17 24 C17 26, 13 32, 13 36.5 C13 36.5 19 37 21.5 32 L20 20 Z" fill="#2b2f33" opacity="0.45" />
          <!-- Eye -->
          <ellipse cx="23.5" cy="16.5" rx="1.3" ry="2.2" fill="#373c41" />
          <!-- Smile / Cheek Crease -->
          <path d="M22.5 23.5 Q26 26.5 30 22.5" fill="none" stroke="#373c41" stroke-width="2.5" stroke-linecap="round" />
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
