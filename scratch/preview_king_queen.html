<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0f172a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .grid { display: flex; gap: 30px; align-items: center; }
  .box { background: #1e293b; padding: 20px; border-radius: 16px; text-align: center; border: 1px solid #334155; }
  svg { width: 120px; height: 120px; }
</style>
</head>
<body>
  <h2>Queen & King SVG Design Preview</h2>
  <div class="grid">
    <div class="box">
      <h3>Queen (White)</h3>
      <svg viewBox="0 0 45 45">
        <g>
          <!-- Ground shadow base -->
          <ellipse cx="22.5" cy="38.5" rx="10.5" ry="3" fill="rgba(0,0,0,0.15)" />
          <!-- Pedestal Base Ring -->
          <ellipse cx="22.5" cy="35" rx="8" ry="2.2" fill="#70889f" stroke="#a0b6cc" stroke-width="2" />
          <!-- Flaring Crown Body -->
          <path d="M14.5 34.5 C16 26, 9 20, 10 14.5 L14.5 19 L19 12 L22.5 17 L26 12 L30.5 19 L35 14.5 C36 20, 29 26, 30.5 34.5 Z" fill="#e6f0fa" stroke="#a0b6cc" stroke-width="2.2" stroke-linejoin="round"/>
          <!-- Inner Crown Sphere/Dome -->
          <ellipse cx="22.5" cy="18" rx="7.5" ry="5.5" fill="#70889f" opacity="0.4" />
          <!-- Front Jewel Dot -->
          <circle cx="22.5" cy="28.5" r="2.2" fill="#70889f" />
        </g>
      </svg>
    </div>
    <div class="box">
      <h3>King (White)</h3>
      <svg viewBox="0 0 45 45">
        <g>
          <!-- Ground shadow base -->
          <ellipse cx="22.5" cy="38.5" rx="10.5" ry="3" fill="rgba(0,0,0,0.15)" />
          <!-- Pedestal Base Ring -->
          <ellipse cx="22.5" cy="35" rx="8" ry="2.2" fill="#70889f" stroke="#a0b6cc" stroke-width="2" />
          <!-- Main Heart/Spade Bulbous Body -->
          <path d="M14.5 34.5 C16 26, 9.5 22, 9.5 16 C9.5 10.5, 15.5 8, 22.5 8 C29.5 8, 35.5 10.5, 35.5 16 C35.5 22, 29 26, 30.5 34.5 Z" fill="#e6f0fa" stroke="#a0b6cc" stroke-width="2.2" stroke-linejoin="round"/>
          <!-- Top Dome Overlay -->
          <ellipse cx="22.5" cy="12" rx="7" ry="3.5" fill="#70889f" opacity="0.4" />
          <!-- Front Collar Curve / Heart Rim -->
          <path d="M15 26 C17 31, 28 31, 30 26 C28 34, 17 34, 15 26 Z" fill="#70889f" opacity="0.3" />
          <!-- Top Cross -->
          <path d="M22.5 3 V10 M19 6.5 H26" stroke="#a0b6cc" stroke-width="3" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
